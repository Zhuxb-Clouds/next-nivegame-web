name: dev-ci
on:
  push:
    branches:
      - master
jobs:
  deploy_ghpages:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      # 仓库依赖管理已统一到 pnpm（锁文件与安全 overrides 均在 pnpm 侧），
      # 旧 workflow 的 yarn 1 读不到 pnpm-workspace.yaml 的 overrides
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install and build
        env:
          NEXT_PUBLIC_BASE_URL: "https://nivegame.huashuocard.cn"
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: prepare remote dir
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MY_HOST }} # 服务器IP（需要在GitHub上自行配置对应的secret）
          username: ${{ secrets.MY_USER }} # 服务器用户名
          password: ${{ secrets.MY_PASS }} # 服务器密码
          port: 22
          script: |
            rm -rf /var/www/nivegame-web
            mkdir -p /var/www/nivegame-web

      - name: deploy
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.MY_HOST }}
          username: ${{ secrets.MY_USER }}
          password: ${{ secrets.MY_PASS }}
          port: 22
          source: "out/*"
          target: /var/www/nivegame-web
          rm: true
          strip_components: 1
