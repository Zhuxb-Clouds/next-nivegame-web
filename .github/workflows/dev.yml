name: dev-ci
on:
  push:
    branches:
      - master
jobs:
  deploy_ghpages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 20.12.2
      - run: npm install -g yarn@1.22.22

      - name: yarn install and build
        env:
          NEXT_PUBLIC_BASE_URL: 'https://nivegame.huashuocard.cn'
        run: |
          yarn
          yarn build

      - name: prepare remote dir
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MY_HOST }} # 服务器IP（需要在GitHub上自行配置对应的secret）
          username: ${{ secrets.MY_USER }} # 服务器用户名
          password: ${{ secrets.MY_PASS }} # 服务器密码
          script: |
            rm -rf /var/www/nivegame-web
            mkdir -p /var/www/nivegame-web

      - name: deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MY_HOST }}
          username: ${{ secrets.MY_USER }}
          password: ${{ secrets.MY_PASS }}
          source: 'out/*'
          target: /var/www/nivegame-web
          strip_components: 1
